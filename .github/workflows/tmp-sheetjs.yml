name: Temporário - conferir SheetJS 0.20.3

on:
  push:
    branches: [chore/padroes-do-projeto]

permissions:
  contents: read

jobs:
  conferir:
    name: Conferir pacote oficial do SheetJS
    runs-on: ubuntu-latest
    steps:
      - name: Baixar e calcular integridade
        run: |
          curl -fsSL -o xlsx.tgz https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          echo "::notice title=integrity::sha512-$(openssl dgst -sha512 -binary xlsx.tgz | base64 -w0)"
          tar xzf xlsx.tgz
          echo "::notice title=pkg::$(node -e 'const p=require("./package/package.json");console.log(JSON.stringify({version:p.version,license:p.license,dependencies:p.dependencies,bin:p.bin,engines:p.engines}))')"
