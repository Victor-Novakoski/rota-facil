name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Testes no navegador
    runs-on: ubuntu-latest
    # imagem oficial do Playwright: já vem com o Chromium e as bibliotecas do sistema,
    # então não precisa baixar e instalar tudo a cada PR (levava uns 4 minutos)
    container:
      image: mcr.microsoft.com/playwright@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf # v1.64.1-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # se o Playwright do package-lock for mais novo que a imagem, baixa só o navegador; se for igual, não faz nada
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          CI: true

  dependencias:
    name: Dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o título do PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|style|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-zà-ú0-9]'
          if printf '%s' "$TITLE" | grep -Pq "$pattern"; then
            echo "Título ok: $TITLE"
          else
            echo "::error::O título do PR precisa seguir o padrão 'tipo: assunto' com o assunto começando em minúsculo. Ex.: 'feat: busca de receitas'. Recebido: $TITLE"
            exit 1
          fi

  main-so-da-develop:
    name: PR para a main só da develop
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a branch de origem
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ]; then
            echo "::error::PR para a main só pode vir da develop. Este vem de '$HEAD'. Abra o PR para a develop."
            exit 1
          fi
          echo "Ok: $HEAD -> $BASE"
